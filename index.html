  app.html — Pixel Art Semester Calendar — development template.
  Page skeleton + mount points consumed by app.js.

  This file is the input to build.py / build.jl, which inline font.css, pixel.css,
  the sprite sheet, schedule.json and app.js into a single offline index.html.
  Open index.html (not this file) for the finished, network-free calendar.
  app.js only ever reads window.SCHEDULE and never fetches anything.
-->

  <style>
/* =============================================================================
   pixel.css - Pixel Art Semester Calendar design system
   Implements STYLE.md (FROZEN) in full. British spelling in all UI copy.

   Load order:  font.css  ->  pixel.css  ->  (app styles)
   Sprite sheet: inline sprites.html / sprites.svg once, near top of <body>.

   Contents
     1  Palette tokens          - light on :root, full dark override
     2  Grid + geometry tokens
     3  Reset / frame
     4  Hand-cut corners (.px-cut) + panel lip
     5  Typography
     6  Sprites
     7  Components (STYLE.md S6, class names are a hard contract)
          .px-panel .px-btn .px-month .px-day .px-day__num
          .px-chip (+ kinds, + [data-course] x8, provisional hatch, dim)
          .px-week  .px-daypanel  .px-legend  .px-countdown
          .px-tip  .px-prose  .px-sr-only
     8  Motion + accessibility (reduced-motion, contrast-more, focus)
     9  Layout / responsive
   ============================================================================= */

/* -----------------------------------------------------------------------------
   1. PALETTE  -  light theme lives on bare :root (complete set),
                  dark theme redefines every token in the media block.
   --------------------------------------------------------------------------- */
:root {
  /* ink + grounds */
  --px-ink:        #3a2e28;
  --px-parchment:  #f4ecd8;
  --px-panel:      #fbf6e9;

  /* 8 course fills - FROZEN, equal to CONTRACT.md courses[].colour */
  --px-lecture:    #8ecae6;   /* diagnostic-imaging          */
  --px-composite:  #ffb4c6;   /* composite-restorations      */
  --px-sign:       #b7e4a0;   /* beginners-sign-language     */
  --px-juris:      #ffd98e;   /* dental-jurisprudence        */
  --px-pain:       #ffab73;   /* pain-management             */
  --px-ortho:      #8fdec9;   /* orthodontics                */
  --px-pharm:      #e6c79c;   /* clinical-dental-pharmacology*/
  --px-public:     #cdb4f0;   /* dental-public-health        */

  /* derived, non-course - defined explicitly, never computed at runtime */
  --px-exam:       #e5544e;
  --px-exam-wash:  #f6c6c0;
  --px-holiday:    #f2b8d0;
  --px-break:      #e9e2cd;
  --px-today:      #fff3b0;
  --px-grid:       #d8ccae;
  --px-focus:      #2b6cb0;

  /* panel lip highlight (a touch lighter than --px-panel; hard, no blur) */
  --px-lip:        #ffffff;

  /* geometry */
  --px-u:      8px;                 /* the grid unit */
  --px-bw:     3px;                 /* chunky border width (3-4px) */
  --px-notch:  4px;                 /* hand-cut corner bite */
  --px-nb:     var(--px-parchment); /* colour seen THROUGH a corner notch */

  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --px-ink:        #f3e9d2;
    --px-parchment:  #2a2320;
    --px-panel:      #352c27;

    /* course fills - STYLE.md dark shades, four deepened for >= 4.5:1 ink contrast
       (sign / juris / pain / ortho failed at the published values; hue kept, only
        value lowered - see report). Light fills are untouched (frozen to JSON). */
    --px-lecture:    #356f86;   /* 4.62 : ink */
    --px-composite:  #8f4a5c;   /* 5.27 */
    --px-sign:       #446e36;   /* was #4c7a3c (4.19) -> 4.93 */
    --px-juris:      #7c5f20;   /* was #8a6a24 (4.17) -> 4.95 */
    --px-pain:       #91542d;   /* was #9c5a30 (4.44) -> 4.96 */
    --px-ortho:      #336e5e;   /* was #3a7d6b (4.02) -> 4.92 */
    --px-pharm:      #7d6039;   /* 4.83 */
    --px-public:     #5e4c86;   /* 6.10 */

    --px-exam:       #ff6b63;
    --px-exam-wash:  #5b3230;
    --px-holiday:    #7a3a55;
    --px-break:      #3a332c;
    --px-today:      #5c4d1e;
    --px-grid:       #4a3f37;
    --px-focus:      #7cc0ff;

    --px-lip:        #4a3f38;
  }
}

/* -----------------------------------------------------------------------------
   2. GRID  -  everything on multiples of --px-u (8). 4px only for hairline insets.
   --------------------------------------------------------------------------- */
.px-u-1 { padding: calc(var(--px-u) * 1); }
.px-u-2 { padding: calc(var(--px-u) * 2); }
.px-gap-1 { gap: calc(var(--px-u) * 1); }
.px-gap-2 { gap: calc(var(--px-u) * 2); }
.px-stack > * + * { margin-block-start: calc(var(--px-u) * 2); }

/* -----------------------------------------------------------------------------
   3. RESET / FRAME
   --------------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

.px-frame,
.px-app {                            /* app.js mounts on .px-app; alias to frame */
  margin: 0;
  min-height: 100%;
  padding: calc(var(--px-u) * 2);
  background-color: var(--px-parchment);
  color: var(--px-ink);
  font-family: var(--px-font-prose, ui-monospace, monospace);
  font-size: 13px;
  line-height: 1.5;
  text-rendering: optimizeSpeed;
  letter-spacing: 0;
  font-variant-ligatures: none;
  -webkit-font-feature-settings: "liga" 0, "clig" 0;
  font-feature-settings: "liga" 0, "clig" 0;
}

.px-frame__header,
.px-frame__title { display: block; }
.px-frame__title { font-family: var(--px-font-display); font-size: 16px; margin: 0 0 var(--px-u); }
.px-frame__main  { display: block; }

img, canvas { image-rendering: pixelated; }

/* whole-pixel transforms only - guard against sub-pixel anti-aliasing */
* { -webkit-font-smoothing: none; }

/* -----------------------------------------------------------------------------
   4. HAND-CUT CORNERS  (STYLE.md S2 - NO border-radius anywhere)

   A real 3-4px solid --px-ink border, then a pointer-events-none ::after that
   stacks ABOVE the host border and paints four small squares of --px-nb (the
   colour behind the element) into the corners - a clean pixel "bite" that reads
   hand-cut. The staircase: a 4px square at the corner plus a 2px square stepped
   one pixel inward, so the cut is stepped, not chamfered.
   --------------------------------------------------------------------------- */
.px-cut {
  position: relative;
  border: var(--px-bw) solid var(--px-ink);
}
.px-cut::after {
  content: "";
  position: absolute;
  inset: calc(-1 * var(--px-bw));         /* cover the border box */
  pointer-events: none;
  z-index: 1;
  background-image:
    linear-gradient(var(--px-nb), var(--px-nb)),
    linear-gradient(var(--px-nb), var(--px-nb)),
    linear-gradient(var(--px-nb), var(--px-nb)),
    linear-gradient(var(--px-nb), var(--px-nb)),
    linear-gradient(var(--px-nb), var(--px-nb)),
    linear-gradient(var(--px-nb), var(--px-nb)),
    linear-gradient(var(--px-nb), var(--px-nb)),
    linear-gradient(var(--px-nb), var(--px-nb));
  background-repeat: no-repeat;
  /* corner 4px bite ............................ inward 2px step */
  background-size:
    var(--px-notch) var(--px-notch), var(--px-notch) var(--px-notch),
    var(--px-notch) var(--px-notch), var(--px-notch) var(--px-notch),
    2px 2px, 2px 2px, 2px 2px, 2px 2px;
  background-position:
    top left, top right, bottom left, bottom right,
    calc(var(--px-notch)) calc(var(--px-notch)),
    calc(100% - var(--px-notch)) calc(var(--px-notch)),
    calc(var(--px-notch)) calc(100% - var(--px-notch)),
    calc(100% - var(--px-notch)) calc(100% - var(--px-notch));
}

/* content must clear the notch/staircase */
.px-cut > * { position: relative; z-index: 2; }

/* -----------------------------------------------------------------------------
   5. TYPOGRAPHY  (STYLE.md S4)
   --------------------------------------------------------------------------- */
.px-display,
h1, h2, h3, h4,
.px-month__title, .px-week__title, .px-frame__title {
  font-family: var(--px-font-display);
  font-weight: 400;
  letter-spacing: 0;
  line-height: 1.4;
  text-transform: none;
}
h1 { font-size: 16px; }
h2, .px-month__title, .px-week__title { font-size: 14px; }
h3 { font-size: 12px; }
h4 { font-size: 10px; }

/* long runs never touch the pixel face */
.px-prose,
.px-prose * {
  font-family: var(--px-font-prose, ui-monospace, monospace) !important;
  font-size: 12px;
  line-height: 1.5;
}
.px-prose { max-width: 64ch; }

.px-sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* -----------------------------------------------------------------------------
   6. SPRITES  (STYLE.md S3 / S5)
   --------------------------------------------------------------------------- */
.px-sprite {
  display: inline-block;
  width: 16px; height: 16px;
  vertical-align: -3px;
  shape-rendering: crispEdges;
  image-rendering: pixelated;
  flex: none;                 /* never stretch inside a flex chip / button */
}
/* when .px-sprite is a wrapper <span> around an <svg>, size the child */
span.px-sprite > svg,
.px-sprite--wrap > svg { display: block; width: 100%; height: 100%; }

/* integer-multiple scaling only (higher specificity than the base so these win) */
svg.px-sprite.px-sprite--16, span.px-sprite.px-sprite--16 { width: 16px; height: 16px; }
svg.px-sprite.px-sprite--32, span.px-sprite.px-sprite--32 { width: 32px; height: 32px; vertical-align: -6px; }
svg.px-sprite.px-sprite--48, span.px-sprite.px-sprite--48 { width: 48px; height: 48px; vertical-align: -10px; }

/* Idle twitch: 2 frames, 1 step per 6s, whole-pixel translate only.
   Fully removed (not slowed) under prefers-reduced-motion - see S8. */
@keyframes px-idle {
  0%, 96%  { transform: translateY(0); }
  98%      { transform: translateY(1px); }
  100%     { transform: translateY(0); }
}
.px-sprite--idle { animation: px-idle 6s steps(1, end) infinite; }

/* -----------------------------------------------------------------------------
   7. COMPONENTS
   --------------------------------------------------------------------------- */

/* ---- 7.1 Raised panel ---------------------------------------------------- */
.px-panel {
  position: relative;
  border: var(--px-bw) solid var(--px-ink);
  background-color: var(--px-panel);
  padding: calc(var(--px-u) * 2);
  /* 4px lip drop shadow + inner highlight, no blur (STYLE.md S2) */
  box-shadow:
    4px 4px 0 0 var(--px-ink),
    inset 2px 2px 0 0 var(--px-lip);
}
.px-panel::after {                         /* hand-cut corners */
  content: "";
  position: absolute;
  inset: calc(-1 * var(--px-bw));
  pointer-events: none;
  z-index: 1;
  --px-nb: var(--px-parchment);
  background-repeat: no-repeat;
  background-image:
    linear-gradient(var(--px-nb), var(--px-nb)), linear-gradient(var(--px-nb), var(--px-nb)),
    linear-gradient(var(--px-nb), var(--px-nb)), linear-gradient(var(--px-nb), var(--px-nb)),
    linear-gradient(var(--px-nb), var(--px-nb)), linear-gradient(var(--px-nb), var(--px-nb)),
    linear-gradient(var(--px-nb), var(--px-nb)), linear-gradient(var(--px-nb), var(--px-nb));
  background-size:
    var(--px-notch) var(--px-notch), var(--px-notch) var(--px-notch),
    var(--px-notch) var(--px-notch), var(--px-notch) var(--px-notch),
    2px 2px, 2px 2px, 2px 2px, 2px 2px;
  background-position:
    top left, top right, bottom left, bottom right,
    var(--px-notch) var(--px-notch),
    calc(100% - var(--px-notch)) var(--px-notch),
    var(--px-notch) calc(100% - var(--px-notch)),
    calc(100% - var(--px-notch)) calc(100% - var(--px-notch));
}
.px-panel > * { position: relative; z-index: 2; }

.px-panel--inset {
  background-color: var(--px-parchment);
  box-shadow: inset 2px 2px 0 0 var(--px-ink);
  padding: var(--px-u);
}
.px-panel--inset::after { --px-nb: var(--px-panel); }

/* dividers inside panels */
.px-divider,
.px-panel hr {
  border: 0;
  border-top: 2px solid var(--px-grid);
  margin: var(--px-u) 0;
}

/* ---- 7.2 Button ------------------------------------------------------------ */
.px-btn,
.px-prev, .px-next, .px-view, .px-daypanel__close {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: calc(var(--px-u) * 5);        /* 40px hit target */
  min-width: calc(var(--px-u) * 5);
  padding: var(--px-u) calc(var(--px-u) * 2);
  border: var(--px-bw) solid var(--px-ink);
  background-color: var(--px-panel);
  color: var(--px-ink);
  font-family: var(--px-font-display);
  font-size: 10px;
  line-height: 1;
  cursor: pointer;
  box-shadow: 3px 3px 0 0 var(--px-ink);
  -webkit-user-select: none;
  user-select: none;
}
.px-btn::after,
.px-prev::after, .px-next::after, .px-view::after, .px-daypanel__close::after {
  content: "";
  position: absolute;
  inset: calc(-1 * var(--px-bw));
  pointer-events: none;
  --px-nb: var(--px-parchment);
  background-repeat: no-repeat;
  background-image:
    linear-gradient(var(--px-nb), var(--px-nb)), linear-gradient(var(--px-nb), var(--px-nb)),
    linear-gradient(var(--px-nb), var(--px-nb)), linear-gradient(var(--px-nb), var(--px-nb));
  background-size: var(--px-notch) var(--px-notch);
  background-position: top left, top right, bottom left, bottom right;
}
.px-btn:hover,
.px-prev:hover, .px-next:hover, .px-view:hover { background-color: var(--px-today); }

.px-btn:active,
.px-btn--active,
.px-view[aria-pressed="true"] {
  background-color: var(--px-today);
  /* press the button 3px into its own shadow - whole-pixel translate only */
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 0 var(--px-ink);
}

.px-btn[disabled],
.px-btn:disabled,
.px-prev[disabled], .px-next[disabled] {
  background-color: var(--px-break);
  color: var(--px-grid);
  cursor: not-allowed;
  box-shadow: 3px 3px 0 0 var(--px-grid);
}

/* ---- 7.2a Calendar controls row (prev · title · next · view toggle) ------ */
.px-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--px-u);
  margin-block: calc(var(--px-u) * 1.5);
}
.px-controls .px-month__title,
.px-controls #px-month-title {
  flex: 1 1 auto;
  margin: 0;
  min-width: calc(var(--px-u) * 18);
}

/* ---- 7.3 Month grid ------------------------------------------------------- */
.px-month { display: block; }
.px-month__title { margin: 0 0 var(--px-u); font-size: 14px; }

.px-month__head,
.px-month__body {
  display: grid;
  /* minmax(0, 1fr) — without the 0 min, a non-wrapping chip label sets a huge
     min-content width and the 7 tracks stop being equal (grid overflows). */
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 1px;                                  /* 1px internal grid lines ... */
  background-color: var(--px-grid);          /* ... shown as the gap colour */
  border: var(--px-bw) solid var(--px-ink);
}
.px-month__body { border-top: 0; }

.px-month__weekday {
  padding: 6px 4px;
  background-color: var(--px-panel);
  font-family: var(--px-font-display);
  font-size: 10px;
  text-align: center;
}

/* ---- 7.4 Day cell ------------------------------------------------------- */
.px-day {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;                 /* let the grid track shrink below chip width */
  overflow: hidden;             /* clip an over-long chip rather than push the grid */
  min-height: calc(var(--px-u) * 9);
  padding: 4px;
  background-color: var(--px-panel);
  --px-nb: var(--px-grid);
}
.px-day__num {
  font-family: var(--px-font-display);
  font-size: 11px;
  line-height: 1;
  align-self: flex-end;
}
.px-day__chips { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }

.px-day--weekend  { background-color: var(--px-parchment); }
.px-day--today {
  background-color: var(--px-today);
  box-shadow: inset 0 0 0 3px var(--px-ink);
}
.px-day--today .px-day__num { text-decoration: underline; }
.px-day--holiday  { background-color: var(--px-holiday); }
.px-day--break    { background-color: var(--px-break); }
.px-day--has-exam { box-shadow: inset 0 0 0 3px var(--px-exam); }
.px-day--today.px-day--has-exam {
  box-shadow: inset 0 0 0 3px var(--px-ink), inset 0 0 0 6px var(--px-exam);
}
.px-day--outside {
  background-color: var(--px-parchment);
  color: var(--px-grid);
}
.px-day--outside .px-day__num { color: var(--px-grid); }
.px-day--empty { background-color: var(--px-parchment); background-image:
  repeating-linear-gradient(45deg, var(--px-grid) 0 1px, transparent 1px 6px); }

/* a small corner sprite slot for exam / holiday days */
.px-day__mark { position: absolute; top: 3px; left: 3px; }

/* ---- 7.5 Event chip ---------------------------------------------------- */
.px-chip {
  --px-chip-fill: var(--px-panel);
  position: relative;
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  max-width: 100%;
  min-height: calc(var(--px-u) * 3);
  padding: 3px 6px;
  border: var(--px-bw) solid var(--px-ink);
  background-color: var(--px-chip-fill);
  color: var(--px-ink);
  font-family: var(--px-font-prose, ui-monospace, monospace);
  font-size: 11px;
  line-height: 1.3;
  text-align: left;
  cursor: pointer;
  --px-nb: var(--px-panel);
}
.px-chip::after {
  content: "";
  position: absolute;
  inset: calc(-1 * var(--px-bw));
  pointer-events: none;
  background-repeat: no-repeat;
  background-image:
    linear-gradient(var(--px-nb), var(--px-nb)), linear-gradient(var(--px-nb), var(--px-nb)),
    linear-gradient(var(--px-nb), var(--px-nb)), linear-gradient(var(--px-nb), var(--px-nb));
  background-size: var(--px-notch) var(--px-notch);
  background-position: top left, top right, bottom left, bottom right;
}
.px-chip > * { position: relative; z-index: 2; }

/* session number set in the pixel face (STYLE.md S4 - kept at the 10px floor) */
.px-chip__no {
  font-family: var(--px-font-display);
  font-size: 10px;
  line-height: 1;
  padding: 1px 3px;
  background-color: var(--px-ink);
  color: var(--px-panel);
  flex: none;
}
.px-chip__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* -- kinds -------------------------------------------------------------- */
.px-chip--class    { background-color: var(--px-chip-fill); }

.px-chip--exam {
  --px-chip-fill: var(--px-exam-wash);
  border-color: var(--px-exam);
  box-shadow: inset 3px 0 0 0 var(--px-exam);
}
.px-chip--resit {
  --px-chip-fill: var(--px-exam-wash);
  border-color: var(--px-exam);
  box-shadow: inset 3px 0 0 0 var(--px-ink), inset 6px 0 0 0 var(--px-exam);
}
.px-chip--quiz {
  --px-chip-fill: var(--px-juris);
  box-shadow: inset 3px 0 0 0 var(--px-ink);
}
.px-chip--milestone {
  --px-chip-fill: var(--px-break);
  box-shadow: inset 3px 0 0 0 var(--px-ink);
}
.px-chip--holiday {
  --px-chip-fill: var(--px-holiday);
}

/* provisional: 45deg 2px hatch of --px-exam over --px-exam-wash, hard stops,
   plus a 3px dashed --px-exam border AND the star sprite (set in markup) - three
   non-colour signals. Hatch kept sparse (2px on / 10px off) so ink text stays
   legible on top, per STYLE.md S6. */
.px-chip--provisional {
  --px-chip-fill: var(--px-exam-wash);
  border-style: dashed;
  border-color: var(--px-exam);
  background-color: var(--px-exam-wash);
  background-image: repeating-linear-gradient(
    45deg,
    var(--px-exam) 0, var(--px-exam) 2px,
    var(--px-exam-wash) 2px, var(--px-exam-wash) 12px
  );
}

/* dim: course filtered off - desaturated flat wash AND reduced size,
   plus it keeps its non-colour signal (star/sprig/hatch) from its kind. */
.px-chip--dim {
  --px-chip-fill: var(--px-break);
  background-image: none;
  border-style: solid;
  border-color: var(--px-grid);
  color: var(--px-ink);
  font-size: 10px;
  min-height: calc(var(--px-u) * 2 + 4px);
  padding: 2px 4px;
  box-shadow: none;
}
.px-chip--dim .px-chip__no { background-color: var(--px-grid); color: var(--px-parchment); }

/* "+N more" affordance used by app.js */
.px-chip--more {
  --px-chip-fill: var(--px-parchment);
  justify-content: center;
  font-family: var(--px-font-display);
  font-size: 10px;
}

/* -- course colours: drive the fill from --px-<course> for all 8 --------- */
.px-chip[data-course="diagnostic-imaging"]           { --px-chip-fill: var(--px-lecture); }
.px-chip[data-course="composite-restorations"]       { --px-chip-fill: var(--px-composite); }
.px-chip[data-course="beginners-sign-language"]      { --px-chip-fill: var(--px-sign); }
.px-chip[data-course="dental-jurisprudence"]         { --px-chip-fill: var(--px-juris); }
.px-chip[data-course="pain-management"]              { --px-chip-fill: var(--px-pain); }
.px-chip[data-course="orthodontics"]                 { --px-chip-fill: var(--px-ortho); }
.px-chip[data-course="clinical-dental-pharmacology"] { --px-chip-fill: var(--px-pharm); }
.px-chip[data-course="dental-public-health"]         { --px-chip-fill: var(--px-public); }

/* a course chip that is also an exam keeps the exam frame but its own hue wash */
.px-chip--exam[data-course],
.px-chip--resit[data-course] { background-color: var(--px-chip-fill); }

/* ---- 7.6 Week time-grid ---------------------------------------------------- */
.px-week__wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.px-week__title { margin: 0 0 var(--px-u); }

.px-week {
  --px-hour: calc(var(--px-u) * 6);          /* one hour row = 48px */
  display: grid;
  grid-template-columns: calc(var(--px-u) * 7) repeat(7, minmax(76px, 1fr));
  /* row 1 day headers · row 2 all-day band · row 3 the 08:00-20:00 time area */
  grid-template-rows: auto auto calc(var(--px-hour) * 12);
  border: var(--px-bw) solid var(--px-ink);
  background-color: var(--px-grid);
  gap: 1px;
  min-width: 620px;
}
.px-week__corner,
.px-week__adhead,
.px-week__adcell,
.px-week__axis,
.px-week__dayhead,
.px-week__day { background-color: var(--px-panel); }

/* the left column (labels) stays put when the grid scrolls sideways */
.px-week__corner,
.px-week__adhead,
.px-week__axis { position: sticky; left: 0; z-index: 3; }

.px-week__dayhead {
  padding: 4px;
  text-align: center;
  font-family: var(--px-font-display);
  font-size: 10px;
}
.px-week__dayhead--today { background-color: var(--px-today); box-shadow: inset 0 0 0 3px var(--px-ink); }

.px-week__adhead {
  display: flex; align-items: center; justify-content: flex-end;
  padding: 2px 4px;
  font-family: var(--px-font-display);
  font-size: 10px;
}
.px-week__adcell {
  display: flex; flex-direction: column; gap: 2px;
  padding: 2px;
  min-width: 0;
}

.px-week__axis {
  display: flex; flex-direction: column; justify-content: space-between;
  align-items: flex-end;
  padding: 2px 4px;
}
.px-week__hour {
  font-family: var(--px-font-display);
  font-size: 10px;
  line-height: 1;
  color: var(--px-ink);
}

.px-week__day { position: relative; min-width: 0; overflow: hidden; }

/* hour rules inside a day column (interior lines only) */
.px-week__slot {
  position: absolute;
  left: 0; right: 0;
  height: 0;
  border-top: 1px solid var(--px-grid);
  pointer-events: none;
}

/* all-day marker: a compact chip in the all-day band, text may wrap */
.px-week__allday { min-height: 0; padding: 2px 4px; font-size: 10px; }
.px-week__allday .px-chip__label { white-space: normal; overflow: visible; }

/* a positioned event inside the time grid */
.px-week__event {
  position: absolute;
  left: 2px; right: 2px;
  min-height: 0;
  border: 2px solid var(--px-ink);
  background-color: var(--px-chip-fill, var(--px-lecture));
  color: var(--px-ink);
  font-size: 10px;
  padding: 1px 3px;
  overflow: hidden;
}
.px-week__event::after { content: none; }   /* drop the chip corner-notch overlay at this size */
.px-week__event[data-course="diagnostic-imaging"]           { --px-chip-fill: var(--px-lecture); }
.px-week__event[data-course="composite-restorations"]       { --px-chip-fill: var(--px-composite); }
.px-week__event[data-course="beginners-sign-language"]      { --px-chip-fill: var(--px-sign); }
.px-week__event[data-course="dental-jurisprudence"]         { --px-chip-fill: var(--px-juris); }
.px-week__event[data-course="pain-management"]              { --px-chip-fill: var(--px-pain); }
.px-week__event[data-course="orthodontics"]                 { --px-chip-fill: var(--px-ortho); }
.px-week__event[data-course="clinical-dental-pharmacology"] { --px-chip-fill: var(--px-pharm); }
.px-week__event[data-course="dental-public-health"]         { --px-chip-fill: var(--px-public); }

/* "now" line - a hard 2px --px-exam rule, whole pixels */
.px-week__now {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background-color: var(--px-exam);
  z-index: 4;
  pointer-events: none;
}
.px-week__now::before {
  content: "";
  position: absolute;
  left: 0; top: -3px;
  width: 8px; height: 8px;
  background-color: var(--px-exam);
}

/* ---- 7.7 Day detail panel ---------------------------------------------- */
.px-daypanel {
  position: relative;
  border: var(--px-bw) solid var(--px-ink);
  background-color: var(--px-panel);
  padding: calc(var(--px-u) * 2);
  box-shadow: 4px 4px 0 0 var(--px-ink), inset 2px 2px 0 0 var(--px-lip);
}
.px-daypanel__title { font-family: var(--px-font-display); font-size: 12px; margin: 0 0 var(--px-u); }
.px-daypanel__main  { display: flex; flex-direction: column; gap: 6px; }

.px-daypanel__row {
  display: grid;
  grid-template-columns: minmax(0, calc(var(--px-u) * 15)) 1fr;
  gap: var(--px-u);
  padding: 6px 0;
  border-top: 2px solid var(--px-grid);
}
.px-daypanel__row:first-of-type { border-top: 0; }

.px-daypanel__time {
  font-family: var(--px-font-display);
  font-size: 10px;
  line-height: 1.4;
}
.px-daypanel__label { font-family: var(--px-font-prose, ui-monospace, monospace); font-size: 12px; }

.px-daypanel__exam {
  border-left: 4px solid var(--px-exam);
  padding-left: 6px;
  background-color: var(--px-exam-wash);
  color: var(--px-ink);
}
.px-daypanel__caveat {                       /* provisional / "subject to change" */
  font-family: var(--px-font-prose, ui-monospace, monospace) !important;
  font-size: 12px;
  line-height: 1.5;
  margin-top: 4px;
}
.px-daypanel__close { position: absolute; top: var(--px-u); right: var(--px-u); padding: 6px; min-width: 32px; min-height: 32px; }

/* ---- 7.8 Legend ------------------------------------------------------- */
.px-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--px-u);
  padding: var(--px-u);
}
.px-legend__chip {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: calc(var(--px-u) * 5);
  padding: 4px var(--px-u);
  border: var(--px-bw) solid var(--px-ink);
  background-color: var(--px-panel);
  color: var(--px-ink);
  font-family: var(--px-font-display);
  font-size: 10px;
  cursor: pointer;
  box-shadow: 3px 3px 0 0 var(--px-ink);
}
.px-legend__swatch {
  width: 14px; height: 14px;
  border: 2px solid var(--px-ink);
  background-color: var(--px-chip-fill, var(--px-lecture));
  flex: none;
}
.px-legend__label { font-family: var(--px-font-display); font-size: 10px; }

.px-legend__chip[data-course="diagnostic-imaging"]           { --px-chip-fill: var(--px-lecture); }
.px-legend__chip[data-course="composite-restorations"]       { --px-chip-fill: var(--px-composite); }
.px-legend__chip[data-course="beginners-sign-language"]      { --px-chip-fill: var(--px-sign); }
.px-legend__chip[data-course="dental-jurisprudence"]         { --px-chip-fill: var(--px-juris); }
.px-legend__chip[data-course="pain-management"]              { --px-chip-fill: var(--px-pain); }
.px-legend__chip[data-course="orthodontics"]                 { --px-chip-fill: var(--px-ortho); }
.px-legend__chip[data-course="clinical-dental-pharmacology"] { --px-chip-fill: var(--px-pharm); }
.px-legend__chip[data-course="dental-public-health"]         { --px-chip-fill: var(--px-public); }

/* toggled OFF: desaturate + shrink + strike (colour is never the only signal) */
.px-legend__chip[aria-pressed="false"] {
  background-color: var(--px-break);
  color: var(--px-grid);
  box-shadow: 2px 2px 0 0 var(--px-grid);
  transform: translate(1px, 1px);
}
.px-legend__chip[aria-pressed="false"] .px-legend__swatch {
  background-color: var(--px-grid);
  background-image: repeating-linear-gradient(45deg,
    var(--px-parchment) 0 1px, transparent 1px 4px);
}
.px-legend__chip[aria-pressed="false"] .px-legend__label { text-decoration: line-through; }

/* ---- 7.9 Countdown strip --------------------------------------------- */
.px-countdown {
  display: flex;
  flex-wrap: wrap;
  gap: var(--px-u);
  align-items: stretch;
  padding: var(--px-u);
  border: var(--px-bw) solid var(--px-ink);
  background-color: var(--px-panel);
  box-shadow: 4px 4px 0 0 var(--px-ink);
}
.px-countdown__cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px var(--px-u);
  background-color: var(--px-parchment);
  border: 2px solid var(--px-ink);
  min-width: calc(var(--px-u) * 12);
}
.px-countdown__num {
  font-family: var(--px-font-display);
  font-size: 24px;                 /* the "hero" numerals */
  line-height: 1;
  color: var(--px-ink);
}
.px-countdown__cell--exam .px-countdown__num { color: var(--px-exam); }
.px-countdown__label {
  font-family: var(--px-font-display);
  font-size: 10px;
  text-align: center;
  line-height: 1.4;
}

/* ---- 7.10 Tooltip --------------------------------------------------- */
.px-tip {
  position: relative;
  display: inline-flex;
}
.px-tip__body,
.px-tip > [role="tooltip"] {
  position: absolute;
  bottom: calc(100% + var(--px-u));
  left: 0;
  width: max-content;
  max-width: 240px;
  padding: 6px var(--px-u);
  border: var(--px-bw) solid var(--px-ink);
  background-color: var(--px-panel);
  color: var(--px-ink);
  font-family: var(--px-font-prose, ui-monospace, monospace);
  font-size: 12px;
  line-height: 1.5;
  box-shadow: 3px 3px 0 0 var(--px-ink);
  z-index: 20;
  /* hidden by default; shown on hover / focus-within. No opacity fades. */
  display: none;
}
.px-tip:hover .px-tip__body,
.px-tip:focus-within .px-tip__body,
.px-tip:hover > [role="tooltip"],
.px-tip:focus-within > [role="tooltip"] { display: block; }

/* The provisional caveat also reveals when its host chip is hovered or focused,
   so keyboard users on a focusable week-view chip get it without reaching the
   nested anchor. */
.px-chip:hover .px-tip__body,
.px-chip:focus .px-tip__body,
.px-chip:focus-within .px-tip__body,
.px-chip:focus-visible .px-tip__body { display: block; }

[hidden] { display: none !important; }

/* -----------------------------------------------------------------------------
   8. MOTION + ACCESSIBILITY  (STYLE.md S7)
   --------------------------------------------------------------------------- */

/* Focus ring: 3px solid, offset 2px, OUTSIDE the chunky border, never clipped.
   Outline paints above the ::after corner overlay, so it is never eaten. */
:where(a, button, input, select, textarea, [tabindex], .px-btn, .px-chip,
       .px-legend__chip, .px-view, .px-prev, .px-next,
       .px-daypanel__close):focus-visible {
  outline: 3px solid var(--px-focus);
  outline-offset: 2px;
  z-index: 5;
}
/* keep a visible ring for UAs without :focus-visible support too */
.px-btn:focus, .px-chip:focus, .px-legend__chip:focus { outline: 3px solid var(--px-focus); outline-offset: 2px; }
.px-btn:focus:not(:focus-visible) { outline: 0; }

@media (prefers-reduced-motion: reduce) {
  .px-sprite--idle { animation: none !important; }
  *, *::before, *::after {
    animation-duration: 0s !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0s !important;
  }
  /* keep the whole-pixel press offset - it is state, not motion - but no tween */
}

@media (prefers-contrast: more) {
  :root { --px-bw: 4px; }

  /* washes drop to solid */
  .px-chip--exam, .px-chip--resit, .px-daypanel__exam { background-color: var(--px-exam); color: var(--px-parchment); }
  .px-chip--provisional {
    background-image: none;
    background-color: var(--px-exam-wash);
    border-width: 4px;
    border-style: dashed;
  }
  .px-day--break { background-color: var(--px-grid); }
  .px-day--today { background-color: var(--px-today); box-shadow: inset 0 0 0 4px var(--px-ink); }
  .px-tip__body, .px-panel, .px-btn, .px-chip { border-width: 4px; }
}

/* -----------------------------------------------------------------------------
   9. LAYOUT / RESPONSIVE  (STYLE.md S8)
   --------------------------------------------------------------------------- */
html, body { max-width: 100%; overflow-x: hidden; }

.px-frame__main,
.px-app { max-width: 1120px; margin-inline: auto; }

@media (max-width: 480px) {
  .px-frame, .px-app { padding: var(--px-u); }
  .px-panel, .px-daypanel { padding: var(--px-u); }
  .px-day { min-height: calc(var(--px-u) * 7); }
  .px-day__num { font-size: 10px; }
  /* Agent C may swap the month grid for an agenda list here; the pixel look holds. */
}

@media print {
  .px-frame, .px-app { background: #fff; }
  .px-panel, .px-btn, .px-chip, .px-countdown { box-shadow: none; }
}
</style>

</head>
<body>
<!--
  sprites.html - inline-ready snippet, identical symbols to sprites.svg.
  Paste this whole block once, near the top of <body>. It is visually hidden.
-->
<svg width="0" height="0" aria-hidden="true"
     focusable="false" style="position:absolute;width:0;height:0;overflow:hidden"
     shape-rendering="crispEdges">
  <style>
    /* 2-colour rule: every sprite = --px-ink outline + exactly one fill token.
       Fallback literals match STYLE.md light theme so the file also renders standalone. */
    .px-sprite, svg > symbol { shape-rendering: crispEdges; }
    .s-k  { fill: var(--px-ink,   #3a2e28); }              /* outline / detail  */
    .s-f  { fill: var(--px-panel, #fbf6e9); }              /* px-tooth  crown   */
    .s-fj { fill: var(--px-juris, #ffd98e); }              /* px-book   cover   */
    .s-fx { fill: var(--px-exam,  #e5544e); }              /* px-star   body    */
    .s-fs { fill: var(--px-sign,  #b7e4a0); }              /* px-sprig  leaves  */
    .s-b  { fill: var(--px-exam,  #e5544e); }              /* px-sprig  berry   */
  </style>
  <symbol id="px-tooth" viewBox="0 0 16 16">
    <rect x="2" y="2" width="12" height="1" class="s-k"/>
    <rect x="2" y="3" width="1" height="1" class="s-k"/>
    <rect x="3" y="3" width="10" height="1" class="s-f"/>
    <rect x="13" y="3" width="1" height="1" class="s-k"/>

<script>
/*
 * app.js — Pixel Art Semester Calendar (Agent C, app logic)
 * Vanilla ES, no framework, no build, no imports, no network in the shipped path.
 *
 * Reads a global `window.SCHEDULE` object shaped exactly as CONTRACT.md §2.
 * The integrator inlines the real schedule.json as `window.SCHEDULE = {…}` before
 * this script runs. For development, app.html sets it from schedule.stub.json.
 *
 * British spelling throughout. Class names target STYLE.md §6 verbatim.
 */
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  Constants
   * ------------------------------------------------------------------ */

  // The five months the calendar covers, in order. month is 0-indexed.
  var MONTH_RANGE = [
    { year: 2026, month: 8 }, // September 2026
    { year: 2026, month: 9 }, // October 2026
    { year: 2026, month: 10 }, // November 2026
    { year: 2026, month: 11 }, // December 2026
    { year: 2027, month: 0 } // January 2027
  ];

  var TERM_END_ISO = '2026-12-18'; // end of term, per the brief
  var WEEK_START_HOUR = 8; // week time-grid runs 08:00 … 20:00
  var WEEK_END_HOUR = 20;
  var FILTER_STORAGE_KEY = 'px-cal:filters-off';
  var PROVISIONAL_TIP = 'Subject to change — final dates from the Examinations Section.';

  var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'];
  // Monday-first weekday initials (British convention).
  var WEEKDAY_INITIALS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  var WEEKDAY_NAMES = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

  /* ------------------------------------------------------------------ *
   *  State
   * ------------------------------------------------------------------ */

  var state = {
    monthIndex: 0, // index into MONTH_RANGE
    selectedDate: null, // 'YYYY-MM-DD' or null
    view: 'month', // 'month' | 'week'
    coursesOff: loadFilters() // Set of courseId that are toggled OFF
  };

  var els = {}; // cached DOM references
  var data = null; // normalised view of window.SCHEDULE

  /* ------------------------------------------------------------------ *
   *  Small date helpers — all ISO strings are 'YYYY-MM-DD'
   * ------------------------------------------------------------------ */

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function isoFromParts(y, m, d) { return y + '-' + pad2(m + 1) + '-' + pad2(d); }

  // Parse 'YYYY-MM-DD' to a UTC-midnight Date (arithmetic only, never displayed).
  function isoToDate(iso) {
    var p = iso.split('-');
    return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  }

  function todayIso() {
    var n = new Date();
    return isoFromParts(n.getFullYear(), n.getMonth(), n.getDate());
  }

  function daysBetween(aIso, bIso) {
    return Math.round((isoToDate(bIso).getTime() - isoToDate(aIso).getTime()) / 86400000);
  }

  // 0 = Monday … 6 = Sunday
  function mondayIndex(iso) {
    var wd = isoToDate(iso).getUTCDay(); // 0 = Sunday
    return (wd + 6) % 7;
  }

  function addDaysIso(iso, n) {
    var d = isoToDate(iso);
    d.setUTCDate(d.getUTCDate() + n);
    return isoFromParts(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }

  function longDate(iso) {
    var d = isoToDate(iso);
    return d.getUTCDate() + ' ' + MONTH_NAMES[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
  }

  function minutesOf(hhmm) {
    if (!hhmm) return null;
    var p = hhmm.split(':');
    return (+p[0]) * 60 + (+p[1]);
  }

  /* ------------------------------------------------------------------ *
   *  Filter persistence (must never throw on file:// or private windows)
   * ------------------------------------------------------------------ */

  function loadFilters() {
    var set = new Set();
    try {
      var raw = window.localStorage.getItem(FILTER_STORAGE_KEY);
      if (raw) {
        JSON.parse(raw).forEach(function (id) { set.add(id); });
      }
    } catch (e) { /* ignore — storage unavailable */ }
    return set;
  }

  function saveFilters() {
    try {
      window.localStorage.setItem(
        FILTER_STORAGE_KEY,
        JSON.stringify(Array.from(state.coursesOff))
      );
    } catch (e) { /* ignore — storage unavailable */ }
  }

  function isCourseOn(courseId) {
    return !courseId || !state.coursesOff.has(courseId);
  }

  /* ------------------------------------------------------------------ *
   *  Data normalisation + indexing
   * ------------------------------------------------------------------ */

  function buildData() {
    var s = window.SCHEDULE || {};
    var events = Array.isArray(s.events) ? s.events.slice() : [];
    var personal = Array.isArray(s.personal) ? s.personal.slice() : [];
    var courses = Array.isArray(s.courses) ? s.courses.slice() : [];

    // Defensive sort by date then start (nulls first) — the contract ships
    // pre-sorted, but we never rely on upstream order.
    function byDateStart(a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      var as = a.start || '', bs = b.start || '';
      if (as !== bs) return as < bs ? -1 : 1;
      return 0;
    }
    events.sort(byDateStart);
    personal.sort(byDateStart);

    var courseById = {};
    courses.forEach(function (c) { courseById[c.id] = c; });

    // Index every event (and personal date) by every ISO day it touches, so
    // multi-day breaks/holidays land in each cell of their span.
    var byDay = {};
    function addToDay(iso, ev) {
      (byDay[iso] || (byDay[iso] = [])).push(ev);
    }
    function indexEvent(ev) {
      addToDay(ev.date, ev);
      if (ev.endDate && ev.endDate !== ev.date) {
        var cur = ev.date;
        for (var guard = 0; guard < 400 && cur < ev.endDate; guard++) {
          cur = addDaysIso(cur, 1);
          addToDay(cur, ev);
        }
      }
    }
    events.forEach(indexEvent);
    personal.forEach(function (p) {
      p.__personal = true;
      indexEvent(p);
    });

    return {
      meta: s.meta || {},
      courses: courses,
      courseById: courseById,
      events: events,
      personal: personal,
      byDay: byDay
    };
  }

  function eventsForDay(iso) {
    var list = (data.byDay[iso] || []).slice();
    list.sort(function (a, b) {
      var as = a.start || '', bs = b.start || '';
      if (as !== bs) return as < bs ? -1 : 1;
      if (a.kind !== b.kind) return a.kind < b.kind ? -1 : 1;
      return (a.id || '') < (b.id || '') ? -1 : 1;
    });
    return list;
  }

  /* ------------------------------------------------------------------ *
   *  DISPLAY MERGE — CONTRACT §2.6
   *  Consecutive events sharing date/courseId/component/kind/lecturer and
   *  contiguous times (end of one === start of the next) collapse into one
   *  display block. Underlying events are untouched; the block's session
   *  number is a range built from the first and last sessionNo.
   * ------------------------------------------------------------------ */

  function mergeForDisplay(dayEvents) {
    var blocks = [];
    var timed = [];
    var allDay = [];

    dayEvents.forEach(function (ev) {
      if (ev.start) timed.push(ev); else allDay.push(ev);
    });
    timed.sort(function (a, b) { return minutesOf(a.start) - minutesOf(b.start); });

    var current = null;
    function mergeKey(ev) {
      return [ev.kind, ev.courseId || '', ev.component || '', ev.lecturer || ''].join('␀');
    }
    timed.forEach(function (ev) {
      if (current &&
        mergeKey(current.__last) === mergeKey(ev) &&
        current.end && ev.start && current.end === ev.start) {
        // extend the running block
        current.end = ev.end;
        current.events.push(ev);
        current.__last = ev;
      } else {
        current = {
          kind: ev.kind,
          courseId: ev.courseId || null,
          component: ev.component || null,
          lecturer: ev.lecturer || null,
          title: ev.title,
          start: ev.start,
          end: ev.end,
          provisional: !!ev.provisional,
          events: [ev],
          __last: ev
        };
        blocks.push(current);
      }
    });

    // Give every block a display session label + a provisional flag that is
    // true if ANY underlying event is provisional (never let one look plain).
    blocks.forEach(function (b) {
      delete b.__last;
      b.provisional = b.events.some(function (e) { return !!e.provisional; });
      var first = b.events[0].sessionNo;
      var last = b.events[b.events.length - 1].sessionNo;
      if (first == null && last == null) {
        b.sessionLabel = null;
      } else if (b.events.length === 1 || first === last || last == null) {
        b.sessionLabel = first != null ? String(first) : null;
      } else {
        b.sessionLabel = first + '–' + last; // en dash
      }
    });

    return { blocks: blocks, allDay: allDay };
  }

  /* ------------------------------------------------------------------ *
   *  Rendering — month view
   * ------------------------------------------------------------------ */

  function currentMonth() { return MONTH_RANGE[state.monthIndex]; }

  function renderMonthTitle() {
    var m = currentMonth();
    els.monthTitle.textContent = MONTH_NAMES[m.month] + ' ' + m.year;
    els.prevBtn.disabled = state.monthIndex === 0;
    els.nextBtn.disabled = state.monthIndex === MONTH_RANGE.length - 1;
  }

  function classifyDay(iso, dayEvents) {
    var cls = ['px-day'];
    var wd = mondayIndex(iso);
    if (wd >= 5) cls.push('px-day--weekend');
    if (iso === todayIso()) cls.push('px-day--today');
    var hasExam = false, hasHoliday = false, hasBreak = false;
    dayEvents.forEach(function (ev) {
      if (ev.kind === 'exam' || ev.kind === 'resit') hasExam = true;
      if (ev.kind === 'holiday') hasHoliday = true;
      if (ev.kind === 'break') hasBreak = true;
    });
    if (hasExam) cls.push('px-day--has-exam');
    if (hasHoliday) cls.push('px-day--holiday');
    if (hasBreak) cls.push('px-day--break');
    return cls;
  }

  function dayAriaLabel(iso, dayEvents) {
    var parts = [longDate(iso)];
    var sessions = 0, exams = 0, quiz = 0;
    var occasions = [];
    dayEvents.forEach(function (ev) {
      if (ev.kind === 'class') sessions++;
      else if (ev.kind === 'exam' || ev.kind === 'resit') exams++;
      else if (ev.kind === 'quiz') quiz++;
      else if (ev.kind === 'holiday' || ev.kind === 'break' || ev.kind === 'milestone') {
        occasions.push(ev.title);
      }
    });
    if (sessions) parts.push(sessions + (sessions === 1 ? ' session' : ' sessions'));
    if (exams) parts.push(exams + (exams === 1 ? ' exam' : ' exams'));
    if (quiz) parts.push('quiz');
    occasions.forEach(function (o) { parts.push(o); });
    if (parts.length === 1) parts.push('no sessions');
    return parts.join(', ');
  }

  // A non-colour signal for each kind (STYLE.md §5/§7 — colour is never the only
  // cue). Symbol ids come from the inlined sprite sheet.
  var SPRITE_FOR_KIND = { exam: 'px-star', resit: 'px-star', quiz: 'px-book', holiday: 'px-sprig' };

  function makeSprite(id, size) {
    // Built via innerHTML so the HTML parser places <svg>/<use> in the SVG
    // namespace for us — no namespace-URI strings anywhere in the shipped file.
    var span = document.createElement('span');
    span.className = 'px-sprite px-sprite--' + (size || 16);
    span.setAttribute('aria-hidden', 'true');
    span.innerHTML = '<svg viewBox="0 0 16 16" focusable="false"><use href="#' + id + '"></use></svg>';
    return span;
  }

  function makeChip(opts) {
    // opts: { kind, courseId, label, sub, provisional, dim, title }
    var chip = document.createElement('span');
    chip.className = 'px-chip px-chip--' + opts.kind;
    if (opts.courseId) chip.setAttribute('data-course', opts.courseId);
    if (opts.provisional) chip.classList.add('px-chip--provisional');
    if (opts.dim) chip.classList.add('px-chip--dim');

    // Sprite cue. Provisional chips get their star from the tooltip anchor below,
    // so only add a standalone sprite when the chip is not provisional.
    var spriteId = SPRITE_FOR_KIND[opts.kind];
    if (spriteId && !opts.provisional && !opts.dim) chip.appendChild(makeSprite(spriteId, 16));

    var label = document.createElement('span');
    label.className = 'px-chip__label';
    label.textContent = opts.label;
    chip.appendChild(label);

    if (opts.sub) {
      var sub = document.createElement('span');
      sub.className = 'px-chip__no';
      sub.textContent = opts.sub;
      chip.appendChild(sub);
    }

    if (opts.provisional) {
      chip.appendChild(makeTip(PROVISIONAL_TIP));
      // Only make the chip a focus stop where it is NOT nested inside a day
      // <button> (month grid). In the month grid the day cell is the control and
      // its panel spells the caveat out in full; a nested tabstop there would be
      // invalid interactive nesting.
      if (opts.focusable) {
        chip.tabIndex = 0; // so the caveat is reachable without a pointer
        chip.setAttribute('aria-label', opts.label + ' — provisional. ' + PROVISIONAL_TIP);
      } else {
        chip.setAttribute('aria-label', opts.label + ' — provisional, subject to change.');
      }
    }
    if (opts.title) chip.title = opts.title;
    return chip;
  }

  function makeTip(text) {
    // Wrapper (.px-tip) + a visible star anchor + the hidden caveat body that
    // pixel.css reveals on hover / focus-within. STYLE.md §6.
    var tip = document.createElement('span');
    tip.className = 'px-tip';
    tip.appendChild(makeSprite('px-star', 16));
    var body = document.createElement('span');
    body.className = 'px-tip__body';
    body.setAttribute('role', 'tooltip');
    body.textContent = text;
    tip.appendChild(body);
    return tip;
  }

  function chipKindLabel(ev) {
    switch (ev.kind) {
      case 'exam': return 'Exam';
      case 'resit': return 'Re-sit';
      case 'quiz': return 'Quiz';
      case 'holiday': return 'Holiday';
      case 'break': return 'No classes';
      case 'milestone': return 'Key date';
      default: return 'Class';
    }
  }

  // Chip label for the grid/week views. The kind is already carried by the
  // colour, the sprite and the sub-badge, so most kinds show the bare title;
  // only the quiz (no component badge) needs a spelled-out prefix.
  function chipDisplayLabel(kind, title) {
    return kind === 'quiz' ? 'Quiz · ' + title : title;
  }

  function renderDayChips(container, iso, dayEvents, opts) {
    opts = opts || {};
    var merged = mergeForDisplay(dayEvents);
    var maxChips = opts.max || 4;
    var rendered = 0;
    var overflow = 0;

    function push(node) {
      if (rendered < maxChips) container.appendChild(node);
      else overflow++;
      rendered++;
    }

    merged.allDay.forEach(function (ev) {
      push(makeChip({
        kind: ev.kind === 'milestone' && ev.__personal ? 'milestone' : ev.kind,
        courseId: ev.courseId,
        label: ev.title,
        provisional: !!ev.provisional,
        dim: !isCourseOn(ev.courseId)
      }));
    });

    merged.blocks.forEach(function (b) {
      push(makeChip({
        kind: b.kind,
        courseId: b.courseId,
        label: chipDisplayLabel(b.kind, b.title),
        sub: b.sessionLabel ? '#' + b.sessionLabel : (b.component || null),
        provisional: b.provisional,
        dim: !isCourseOn(b.courseId),
        title: b.start ? b.start + '–' + b.end : null
      }));
    });

    if (overflow > 0) {
      var more = document.createElement('span');
      more.className = 'px-chip px-chip--more';
      more.textContent = '+' + overflow + ' more';
      container.appendChild(more);
    }
  }

  function renderMonth() {
    var grid = els.grid;
    grid.textContent = '';
    var m = currentMonth();

    // weekday header row
    var head = document.createElement('div');
    head.className = 'px-month__head';
    head.setAttribute('role', 'row');
    WEEKDAY_INITIALS.forEach(function (ini, i) {
      var cell = document.createElement('div');
      cell.className = 'px-month__weekday';
      cell.setAttribute('role', 'columnheader');
      cell.setAttribute('aria-label', WEEKDAY_NAMES[i]);
      cell.textContent = ini;
      head.appendChild(cell);
    });
    grid.appendChild(head);

    var body = document.createElement('div');
    body.className = 'px-month__body';
    body.setAttribute('role', 'rowgroup');

    var first = isoFromParts(m.year, m.month, 1);
    var lead = mondayIndex(first);
    var startIso = addDaysIso(first, -lead); // first cell (may be previous month)

    for (var i = 0; i < 42; i++) {
      var iso = addDaysIso(startIso, i);
      var d = isoToDate(iso);
      var inMonth = d.getUTCMonth() === m.month && d.getUTCFullYear() === m.year;
      var dayEvents = eventsForDay(iso);

      var cell = document.createElement(inMonth ? 'button' : 'div');
      cell.className = classifyDay(iso, dayEvents).join(' ');
      cell.dataset.date = iso;

      if (inMonth) {
        cell.type = 'button';
        cell.setAttribute('role', 'gridcell');
        cell.setAttribute('aria-label', dayAriaLabel(iso, dayEvents));
        if (iso === state.selectedDate) cell.setAttribute('aria-current', 'date');
        cell.addEventListener('click', function () { selectDay(this.dataset.date); });
      } else {
        cell.className += ' px-day--outside';
        cell.setAttribute('aria-hidden', 'true');
      }

      var num = document.createElement('span');
      num.className = 'px-day__num';
      num.textContent = d.getUTCDate();
      cell.appendChild(num);

      if (inMonth) {
        var chips = document.createElement('span');
        chips.className = 'px-day__chips';
        renderDayChips(chips, iso, dayEvents, { max: 4 });
        cell.appendChild(chips);
      }

      body.appendChild(cell);
    }

    grid.appendChild(body);
  }

  /* ------------------------------------------------------------------ *
   *  Rendering — day detail panel
   * ------------------------------------------------------------------ */

  function renderDayPanel() {
    var panel = els.dayPanel;
    panel.textContent = '';

    if (!state.selectedDate) {
      panel.hidden = true;
      return;
    }
    panel.hidden = false;

    var iso = state.selectedDate;
    var dayEvents = eventsForDay(iso);

    var h = document.createElement('h3');
    h.className = 'px-daypanel__title';
    h.textContent = longDate(iso);
    panel.appendChild(h);

    var close = document.createElement('button');
    close.type = 'button';
    close.className = 'px-btn px-daypanel__close';
    close.textContent = 'Close';
    close.addEventListener('click', function () {
      state.selectedDate = null;
      renderAll();
      els.monthTitle.focus();
    });
    panel.appendChild(close);

    var merged = mergeForDisplay(dayEvents);

    if (!merged.allDay.length && !merged.blocks.length) {
      var empty = document.createElement('p');
      empty.className = 'px-prose';
      empty.textContent = 'Nothing scheduled.';
      panel.appendChild(empty);
      return;
    }

    merged.allDay.forEach(function (ev) {
      panel.appendChild(dayPanelRow({
        time: 'All day',
        kind: ev.kind,
        courseId: ev.courseId,
        title: ev.title,
        component: ev.component,
        provisional: !!ev.provisional,
        note: ev.note,
        lecturer: ev.lecturer,
        endDate: ev.endDate
      }));
    });

    merged.blocks.forEach(function (b) {
      // Prefer the merged block's own note if all its events agree; else list each.
      var notes = [];
      b.events.forEach(function (e) { if (e.note && notes.indexOf(e.note) === -1) notes.push(e.note); });
      panel.appendChild(dayPanelRow({
        time: b.start + '–' + b.end,
        kind: b.kind,
        courseId: b.courseId,
        title: b.title,
        component: b.component,
        session: b.sessionLabel,
        lecturer: b.lecturer,
        provisional: b.provisional,
        note: notes.join(' — '),
        count: b.events.length
      }));
    });
  }

  function dayPanelRow(o) {
    var row = document.createElement('div');
    row.className = 'px-daypanel__row';
    var isExam = o.kind === 'exam' || o.kind === 'resit';
    if (isExam) row.classList.add('px-daypanel__exam');
    if (o.courseId) row.setAttribute('data-course', o.courseId);
    if (o.provisional) row.classList.add('px-chip--provisional');
    if (o.courseId && !isCourseOn(o.courseId)) row.classList.add('px-chip--dim');

    var time = document.createElement('span');
    time.className = 'px-daypanel__time';
    time.textContent = o.time;
    row.appendChild(time);

    var main = document.createElement('div');
    main.className = 'px-daypanel__main';

    var title = document.createElement('span');
    title.className = 'px-daypanel__label';
    var bits = [];
    if (o.kind !== 'class') bits.push(chipKindLabel({ kind: o.kind }));
    bits.push(o.title);
    if (o.component) bits.push(o.component);
    if (o.session) bits.push('#' + o.session);
    if (o.count && o.count > 1) bits.push('(' + o.count + ' sessions)');
    title.textContent = bits.join(' · ');
    main.appendChild(title);

    if (o.endDate) {
      var span = document.createElement('span');
      span.className = 'px-prose';
      span.textContent = 'Until ' + longDate(o.endDate) + '.';
      main.appendChild(span);
    }

    if (o.lecturer) {
      var lec = document.createElement('span');
      lec.className = 'px-prose';
      lec.textContent = o.lecturer;
      main.appendChild(lec);
    }

    if (o.provisional) {
      var caveat = document.createElement('span');
      caveat.className = 'px-prose px-daypanel__caveat';
      caveat.textContent = PROVISIONAL_TIP;
      main.appendChild(caveat);
    }

    // The parser prefixes every provisional note with PROVISIONAL_TIP; the
    // caveat line above already carries it, so strip that lead here to avoid
    // printing the same sentence twice.
    var noteText = o.note || '';
    if (o.provisional && noteText.indexOf(PROVISIONAL_TIP) === 0) {
      noteText = noteText.slice(PROVISIONAL_TIP.length).replace(/^[\s—-]+/, '');
    }
    if (noteText) {
      var note = document.createElement('p');
      note.className = 'px-prose';
      note.textContent = noteText;
      main.appendChild(note);
    }

    row.appendChild(main);
    return row;
  }

  /* ------------------------------------------------------------------ *
   *  Rendering — week time-grid (08:00 … 20:00)
   * ------------------------------------------------------------------ */

  function renderWeek() {
    var week = els.week;
    week.textContent = '';

    var anchor = state.selectedDate || todayIso();
    var monday = addDaysIso(anchor, -mondayIndex(anchor));
    var hours = WEEK_END_HOUR - WEEK_START_HOUR; // 12
    var spanMinutes = hours * 60;

    els.weekTitle.textContent = 'Week of ' + longDate(monday);

    var dayIsos = [];
    for (var d = 0; d < 7; d++) dayIsos.push(addDaysIso(monday, d));

    // --- row 1: corner + 7 day headers ---------------------------------
    var corner = document.createElement('div');
    corner.className = 'px-week__corner';
    week.appendChild(corner);
    dayIsos.forEach(function (iso, i) {
      var head = document.createElement('div');
      head.className = 'px-week__dayhead';
      if (iso === todayIso()) head.classList.add('px-week__dayhead--today');
      head.textContent = WEEKDAY_INITIALS[i] + ' ' + isoToDate(iso).getUTCDate();
      week.appendChild(head);
    });

    // --- row 2: all-day band (label cell + 7 day cells) ----------------
    var adHead = document.createElement('div');
    adHead.className = 'px-week__adhead';
    adHead.textContent = 'all day';
    week.appendChild(adHead);
    var adCells = {};
    dayIsos.forEach(function (iso) {
      var adc = document.createElement('div');
      adc.className = 'px-week__adcell';
      adCells[iso] = adc;
      week.appendChild(adc);
    });

    // --- row 3: hour axis + 7 day columns -----------------------------
    var axis = document.createElement('div');
    axis.className = 'px-week__axis';
    for (var hr = WEEK_START_HOUR; hr <= WEEK_END_HOUR; hr++) {
      var lab = document.createElement('div');
      lab.className = 'px-week__hour';
      lab.textContent = pad2(hr) + ':00';
      axis.appendChild(lab);
    }
    week.appendChild(axis);

    dayIsos.forEach(function (iso) {
      var col = document.createElement('div');
      col.className = 'px-week__day';
      col.dataset.date = iso;

      // interior hour rules (not at 0% or 100%)
      for (var s = 1; s < hours; s++) {
        var slot = document.createElement('div');
        slot.className = 'px-week__slot';
        slot.style.top = (s / hours * 100) + '%';
        col.appendChild(slot);
      }

      var merged = mergeForDisplay(eventsForDay(iso));

      merged.allDay.forEach(function (ev) {
        var tag = makeChip({
          kind: ev.kind === 'milestone' && ev.__personal ? 'milestone' : ev.kind,
          courseId: ev.courseId,
          label: ev.title,
          provisional: !!ev.provisional,
          dim: !isCourseOn(ev.courseId)
        });
        tag.classList.add('px-week__allday');
        adCells[iso].appendChild(tag);
      });

      merged.blocks.forEach(function (b) {
        var startMin = minutesOf(b.start);
        var endMin = minutesOf(b.end) || (startMin + 60);
        var top = (startMin - WEEK_START_HOUR * 60) / spanMinutes;
        var height = (endMin - startMin) / spanMinutes;
        if (top >= 1 || height <= 0) return; // outside the visible grid
        top = Math.max(0, top);
        height = Math.min(1 - top, height);

        var evEl = makeChip({
          kind: b.kind,
          courseId: b.courseId,
          label: chipDisplayLabel(b.kind, b.title),
          sub: b.sessionLabel ? '#' + b.sessionLabel : (b.component || null),
          provisional: b.provisional,
          dim: !isCourseOn(b.courseId),
          focusable: true
        });
        evEl.classList.add('px-week__event');
        evEl.style.top = (top * 100) + '%';
        evEl.style.height = 'calc(' + (height * 100) + '% - 2px)';
        col.appendChild(evEl);
      });

      if (iso === todayIso()) {
        var now = new Date();
        var nowMin = now.getHours() * 60 + now.getMinutes();
        var nowTop = (nowMin - WEEK_START_HOUR * 60) / spanMinutes;
        if (nowTop >= 0 && nowTop <= 1) {
          var line = document.createElement('div');
          line.className = 'px-week__now';
          line.style.top = (nowTop * 100) + '%';
          col.appendChild(line);
        }
      }

      week.appendChild(col);
    });

    els.weekWrap.hidden = state.view !== 'week';
  }

  /* ------------------------------------------------------------------ *
   *  Rendering — legend / course filter
   * ------------------------------------------------------------------ */

  function renderLegend() {
    var legend = els.legend;
    legend.textContent = '';
    data.courses.forEach(function (c) {
      var on = isCourseOn(c.id);
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'px-legend__chip';
      chip.setAttribute('data-course', c.id);
      chip.setAttribute('aria-pressed', on ? 'true' : 'false');
      if (!on) chip.classList.add('px-chip--dim');

      var swatch = document.createElement('span');
      swatch.className = 'px-legend__swatch';
      chip.appendChild(swatch);

      var text = document.createElement('span');
      text.className = 'px-legend__label';
      text.textContent = c.name;
      chip.appendChild(text);

      chip.addEventListener('click', function () {
        if (state.coursesOff.has(c.id)) state.coursesOff.delete(c.id);
        else state.coursesOff.add(c.id);
        saveFilters();
        renderAll();
        announce(c.name + (isCourseOn(c.id) ? ' shown' : ' hidden'));
      });

      legend.appendChild(chip);
    });
  }

  /* ------------------------------------------------------------------ *
   *  Rendering — countdown strip
   * ------------------------------------------------------------------ */

  function renderCountdown() {
    var strip = els.countdown;
    strip.textContent = '';
    var today = todayIso();

    // Next exam from today (inclusive).
    var nextExam = null;
    data.events.forEach(function (ev) {
      if (ev.kind !== 'exam') return;
      if (ev.date < today) return;
      if (!nextExam || ev.date < nextExam.date) nextExam = ev;
    });

    var examCell;
    if (nextExam) {
      var dn = daysBetween(today, nextExam.date);
      examCell = countdownCell(
        dn === 0 ? 'Today' : String(dn),
        dn === 0 ? 'next exam is today' : (dn === 1 ? 'day to the next exam' : 'days to the next exam')
      );
    } else {
      examCell = countdownCell('—', 'no exams ahead');
    }
    strip.appendChild(examCell);

    // Days to end of term.
    var toEnd = daysBetween(today, TERM_END_ISO);
    var endCell;
    if (toEnd > 0) {
      endCell = countdownCell(String(toEnd), toEnd === 1 ? 'day to end of term' : 'days to end of term');
    } else if (toEnd === 0) {
      endCell = countdownCell('Today', 'term ends today');
    } else {
      endCell = countdownCell('—', 'term has ended');
    }
    strip.appendChild(endCell);
  }

  function countdownCell(num, label) {
    var cell = document.createElement('div');
    cell.className = 'px-countdown__cell';
    var n = document.createElement('span');
    n.className = 'px-countdown__num';
    n.textContent = num;
    var l = document.createElement('span');
    l.className = 'px-countdown__label';
    l.textContent = label;
    cell.appendChild(n);
    cell.appendChild(l);
    return cell;
  }

  /* ------------------------------------------------------------------ *
   *  Orchestration
   * ------------------------------------------------------------------ */

  function renderAll() {
    renderMonthTitle();
    renderMonth();
    renderLegend();
    renderCountdown();
    renderDayPanel();
    renderWeek();

    els.grid.hidden = state.view !== 'month';
    els.weekWrap.hidden = state.view !== 'week';
    els.viewToggle.setAttribute('aria-pressed', state.view === 'week' ? 'true' : 'false');
    els.viewToggle.textContent = state.view === 'week' ? 'Month view' : 'Week view';
  }

  function announce(msg) {
    if (els.live) els.live.textContent = msg;
  }

  function goMonth(delta) {
    var next = state.monthIndex + delta;
    if (next < 0 || next >= MONTH_RANGE.length) return;
    state.monthIndex = next;
    renderAll();
    var m = currentMonth();
    announce('Showing ' + MONTH_NAMES[m.month] + ' ' + m.year);
    els.monthTitle.focus();
  }

  function selectDay(iso) {
    state.selectedDate = iso;
    renderAll();
    if (state.view === 'month') {
      // move focus into the panel for keyboard users
      var title = els.dayPanel.querySelector('.px-daypanel__title');
      if (title) { title.setAttribute('tabindex', '-1'); title.focus(); }
    }
    announce(longDate(iso) + ' selected. ' + dayAriaLabel(iso, eventsForDay(iso)));
  }

  function toggleView() {
    state.view = state.view === 'month' ? 'week' : 'month';
    if (state.view === 'week' && !state.selectedDate) {
      // anchor the week on today if it is in range, else the shown month
      var t = todayIso();
      var m = currentMonth();
      state.selectedDate = (isoToDate(t).getUTCFullYear() === m.year &&
        isoToDate(t).getUTCMonth() === m.month) ? t : isoFromParts(m.year, m.month, 1);
    }
    renderAll();
    announce(state.view === 'week' ? 'Week view' : 'Month view');
  }

  function onKeydown(e) {
    if (e.defaultPrevented) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

    switch (e.key) {
      case 'ArrowLeft':
      case 'PageUp':
      case 'ArrowUp':
        goMonth(-1); e.preventDefault(); break;
      case 'ArrowRight':
      case 'PageDown':
      case 'ArrowDown':
        goMonth(1); e.preventDefault(); break;
      case 'Escape':
        if (state.selectedDate) {
          state.selectedDate = null;
          renderAll();
          els.monthTitle.focus();
          e.preventDefault();
        }
        break;
      default:
        break;
    }
  }

  /* ------------------------------------------------------------------ *
   *  Boot
   * ------------------------------------------------------------------ */

  function pickStartMonth() {
    var t = todayIso();
    var y = isoToDate(t).getUTCFullYear();
    var mo = isoToDate(t).getUTCMonth();
    for (var i = 0; i < MONTH_RANGE.length; i++) {
      if (MONTH_RANGE[i].year === y && MONTH_RANGE[i].month === mo) return i;
    }
    return 0; // default: September 2026
  }

  function cacheEls() {
    els.frame = document.getElementById('px-app');
    els.monthTitle = document.getElementById('px-month-title');
    els.prevBtn = document.getElementById('px-prev');
    els.nextBtn = document.getElementById('px-next');
    els.viewToggle = document.getElementById('px-view-toggle');
    els.grid = document.getElementById('px-grid');
    els.weekWrap = document.getElementById('px-week-wrap');
    els.week = document.getElementById('px-week');
    els.weekTitle = document.getElementById('px-week-title');
    els.legend = document.getElementById('px-legend');
    els.countdown = document.getElementById('px-countdown');
    els.dayPanel = document.getElementById('px-daypanel');
    els.live = document.getElementById('px-live');
    els.metaLine = document.getElementById('px-meta-line');
  }

  function showFatal(msg) {
    var host = document.getElementById('px-app') || document.body;
    var p = document.createElement('p');
    p.className = 'px-prose';
    p.setAttribute('role', 'alert');
    p.textContent = msg;
    host.appendChild(p);
  }

  function boot() {
    cacheEls();
    if (!window.SCHEDULE || !Array.isArray(window.SCHEDULE.events)) {
      showFatal('The schedule could not be loaded. Expected window.SCHEDULE with an events array.');
      return;
    }
    data = buildData();
    state.monthIndex = pickStartMonth();

    if (els.metaLine && data.meta) {
      var bits = [data.meta.semester, data.meta.year, data.meta.programme].filter(Boolean);
      if (data.meta.source) bits.push(data.meta.source);
      els.metaLine.textContent = bits.join(' · ');
    }

    els.prevBtn.addEventListener('click', function () { goMonth(-1); });
    els.nextBtn.addEventListener('click', function () { goMonth(1); });
    els.viewToggle.addEventListener('click', toggleView);
    document.addEventListener('keydown', onKeydown);

    els.monthTitle.setAttribute('tabindex', '-1');

    renderAll();
  }

  // Expose a re-boot hook for the dev-only async loader in app.html.
  window.__pxBoot = boot;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      if (window.SCHEDULE) boot();
    });
  } else if (window.SCHEDULE) {
    boot();
  }
})();
</script>
</body>
